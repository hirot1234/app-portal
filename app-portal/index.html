<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UE16で公開しているWebアプリの一覧ポータル" />
  <meta name="theme-color" content="#080b14" />
  <meta name="color-scheme" content="dark" />
  <title>UE16 Apps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#apps">アプリ一覧へ移動</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">U</div>
      <div>
        <p class="eyebrow">UE16.CC</p>
        <h1>Apps</h1>
        <p class="intro">日々の作業を少し楽にする、個人開発のWebツール。</p>
      </div>
    </header>

    <section class="toolbar" aria-label="アプリの検索と絞り込み">
      <label class="search-box" for="search">
        <span aria-hidden="true">⌕</span>
        <span class="visually-hidden">アプリを検索</span>
        <input id="search" type="search" placeholder="アプリを検索" autocomplete="off" enterkeyhint="search" />
      </label>
      <div id="filters" class="filters" aria-label="カテゴリー" role="group"></div>
    </section>

    <section id="apps" aria-labelledby="apps-heading">
      <div class="section-heading">
        <h2 id="apps-heading">公開中のアプリ</h2>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div id="app-grid" class="app-grid"></div>
      <p id="empty" class="empty" role="status" hidden>条件に一致するアプリはありません。</p>
    </section>

    <footer>
      <span>© <span id="year"></span> UE16</span>
      <span>Built for the web.</span>
    </footer>
  </main>

  <noscript>
    <p class="noscript">アプリ一覧の表示にはJavaScriptが必要です。</p>
  </noscript>
  <script src="./app.js" defer></script>
</body>
</html>
